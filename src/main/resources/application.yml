server:
  address: 0.0.0.0
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict
spring:
  datasource:
    url: jdbc:h2:file:./data/eventproof;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
  h2:
    console:
      enabled: false
logging:
  level:
    org.springframework.security: INFO
