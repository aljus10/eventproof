<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventProof - Public Certificate Verification</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="verify-shell">

  <main class="verify-card">
    <div style="display:flex; justify-content:center; margin-bottom:14px;">
      <div class="brand-icon" style="width:48px; height:48px; font-size:1.3rem; border-radius:14px;" aria-hidden="true">EP</div>
    </div>
    
    <h1 style="margin:0 0 6px; font-size:1.75rem; font-weight:750; letter-spacing:-0.02em;">EventProof Verification</h1>
    <p class="muted" style="margin:0 0 24px; font-size:0.92rem; color:#94a3b8;">Cryptographic e-Certificate Public Trust Service</p>

    <!-- Injected Result Container -->
    <div id="verifyResult" style="line-height:1.6; font-size:0.95rem;">
      <div class="muted">Checking certificate authenticity...</div>
    </div>

    <div style="margin-top:28px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.08); font-size:0.8rem; color:#64748b;">
      EventProof &bull; Local System Cryptographic Verification
    </div>
  </main>

  <script src="/js/verify.js"></script>
</body>
</html>
