<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventProof - Public Certificate Verification</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3L5 7.5V14.5C5 21.6 9.7 28.1 16 29.5C22.3 28.1 27 21.6 27 14.5V7.5L16 3Z' fill='%231d4ed8' stroke='%233b82f6' stroke-width='1.5'/%3E%3Cpath d='M11 15.5L14.5 19L21.5 11.5' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="verify-shell">

  <main class="verify-card">
    <div style="display:flex; justify-content:center; margin-bottom:14px;">
      <div class="brand-icon" style="width:52px; height:52px; border-radius:14px; background:linear-gradient(135deg, rgba(37,99,235,0.3) 0%, rgba(30,64,175,0.6) 100%); border:1px solid rgba(147,197,253,0.35); box-shadow:0 8px 24px rgba(0,0,0,0.4);" aria-hidden="true" title="EventProof">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 3L5 7.5V14.5C5 21.6 9.7 28.1 16 29.5C22.3 28.1 27 21.6 27 14.5V7.5L16 3Z" fill="url(#verifyShieldGrad)" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M16 5.8L7.5 9.3V14.5C7.5 20.1 11.1 25.2 16 26.5C20.9 25.2 24.5 20.1 24.5 14.5V9.3L16 5.8Z" fill="#1e40af" fill-opacity="0.35"/>
          <path d="M11 15.5L14.5 19L21.5 11.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="verifyShieldGrad" x1="5" y1="3" x2="27" y2="29.5" gradientUnits="userSpaceOnUse">
              <stop stop-color="#60a5fa"/>
              <stop offset="1" stop-color="#2563eb"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>
    
    <h1 style="margin:0 0 6px; font-size:1.75rem; font-weight:750; letter-spacing:-0.02em;">EventProof Verification</h1>
    <p class="muted" style="margin:0 0 22px; font-size:0.92rem; color:#94a3b8;">Cryptographic e-Certificate Public Trust Service</p>

    <!-- Interactive Certificate Lookup Form -->
    <div style="margin-bottom: 22px;">
      <form id="verifyForm" onsubmit="event.preventDefault(); verifyManualSubmit();" style="display:flex; gap:8px;">
        <input id="verifyInput" type="text" placeholder="Enter Certificate ID (e.g. EP-...) or paste URL" style="flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); color:#ffffff; padding:10px 14px; border-radius:10px; font-size:0.9rem;" autocomplete="off" spellcheck="false">
        <button type="submit" id="verifyBtn" class="btn primary small-btn" style="padding:10px 18px; font-weight:700; font-size:0.88rem; white-space:nowrap;">Inspect</button>
      </form>
      <div style="text-align:left; margin-top:6px; font-size:0.75rem; color:#64748b;">
        Paste a Certificate ID or QR code link to inspect Ed25519 digital signature validity.
      </div>
    </div>

    <!-- Injected Result Container -->
    <div id="verifyResult" style="line-height:1.6; font-size:0.95rem;">
      <div class="muted" style="color:#94a3b8;">Enter a certificate credential above to verify.</div>
    </div>

    <div style="margin-top:28px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.08); font-size:0.8rem; color:#64748b;">
      EventProof &bull; Ed25519 Cryptographic Verification Gateway &bull; Anonymous Access
    </div>
  </main>

  <script src="/js/verify.js"></script>
</body>
</html>
